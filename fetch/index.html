<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API & Assicronas</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-blue-300 font-serif flex flex-col justify-center items-center min-h-screen">
  <!-- Atividade 1 -->
  <h1 class="text-4xl p-4">Consulta de CEP</h1>
  <!-- P => Para trazer os dados do CEP -->
  <p id="cep-info"></p> 
  <!-- P => Para trazer o erro tratado do CEP -->
  <p id="cep-error"></p> 

  <!-- Atividade 2 -->
  <h2 class="text-4xl pt-4">Postes atv-2</h2>
  <div>
    <!-- h1 => Título da API do post -->
    <h1 class="text-2xl" id="title"></h1>
    <!-- p => Corpo da API do post -->
    <p id="post-body"></p>
  </div>
  <script src="index.js"></script>
</body>

</html>
