    <input class="bg-white text-black" type="text" id="nome">
    <input class="bg-white text-black" type="text" id="passaword">
    <button type="submit">Enviar</button>
  </form>

  <script>

    const formText = document.querySelector('#formText');
    const nome = document.querySelector('#nome');
    const passaword = document.querySelector('#passaword');
    let mensagem = [];

    formText.addEventListener('submit', (e) => {
      e.preventDefault();
      const nomeUser = nome.value;
      const passawordUser = passaword.value;
      if (nomeUser == "" && passawordUser == "") {
        alert("por favor, preencha todos os campos");
      } else {
        mensagem.push({ nome: nomeUser, passaword: passawordUser })

    })

    const form = document.querySelector('form');
    const input = document.querySelector('#nome');
    let nomes = [];
    // Adiciona um evento de submit ao formulário para capturar o nome digitado e adicioná-lo ao Array de nomes
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const nome = input.value;
      if (nome == "") {
        alert("por favor, digite um nome");
      } else {
        nomes.push(nome); // Adiciona o nome digitado ao Array de nomes
        console.log(nomes);
        input.value = "";
      }
    })
    let produto = [
      { nome: "Camiseta", preco: 29.99 },
      { nome: "Calça", preco: 49.99 },
      { nome: "Tênis", preco: 89.99 }
    ];

    document.write(produto[0].nome, " - R$ ", produto[0].preco) // Acessa o nome e o preço do primeiro produto (Camiseta) e os exibe no documento
    console.log(produto[0].preco) // Acessa o nome do primeiro produto (Camiseta);

    // Arrays e métodos de Array
    let nomesExemplos = ["Lavínia", "Maria", "João", "Pedro", "Ana", 'julia', 'juliana', 'julio', 'juliana', 'julio', 'juliana', 'julio'];
    console.log(nomesExemplos) // Acessa todo o Array
    console.log(nomesExemplos[2]) // Acessa o elemento do Array na posição 2 (João)
    console.log(nomesExemplos.length) // Acessa o tamanho do Array (6)
    console.log(nomesExemplos.push("Carlos")) // Adiciona um elemento ao final do Array (Carlos)
    console.log(nomesExemplos) // Acessa todo o Array atualizado
    console.log(nomesExemplos.pop()) // Remove o último elemento do Array (Carlos)
    console.log(nomesExemplos) // Acessa todo o Array atualizado
    console.log(nomesExemplos.unshift("Sofia")) // Remove o primeiro elemento do Array (Lavínia)
    console.log(nomesExemplos) // Acessa todo o Array atualizado
    console.log(nomesExemplos.sort()) // Ordena o Array em ordem alfabética
    console.log(nomesExemplos.reduce((acc, nome) => acc + " " + nome)) // Reduz o Array a uma única string concatenando os nomes

    const list = document.querySelector('#list');

    for (let i = 0; i < nomesExemplos.length; i++) {
      list.innerHTML += `<li>${nomesExemplos[i]}</li>` // Acessa cada elemento do Array usando um loop for e adiciona cada nome como um item de lista no HTML
    }
    nomesExemplos.forEach((nome) => console.log(nome)) // Itera sobre cada elemento do Array e imprime o nome no console usando forEach

    // Loop for para acessar cada elemento do Array de nomesExemplos
    for (let i = 0; i < nomesExemplos.length; i++) {
      console.log(nomesExemplos[i]) // Acessa cada elemento do Array usando um loop for
    }

    let numeros = 0;
    do {
     console.log(numeros)
    } while (numeros < 10) {
      numeros++
    }


  </script>
</body>
